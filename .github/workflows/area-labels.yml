name: Area labels

# Adds the labels a title's `[area]` prefix and words ask for (scripts/area-labels.py) to an issue or pull request
# when it is opened or its title is edited. Labels are only added, so one a maintainer took off stays off until the
# title changes again. pull_request_target takes this workflow from main and nothing of the pull request is checked
# out or run: the title reaches the script as an argument through the environment
on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  labels:
    name: Label the area
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/area-labels.py
          sparse-checkout-cone-mode: false
      - name: Add the labels
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
        run: |
          mapfile -t labels < <(python3 scripts/area-labels.py "$TITLE")
          for label in "${labels[@]}"; do
            # a label that exists is kept as it is; the areas' own start with one colour
            gh label create "$label" --color 1d76db 2>/dev/null || true
            gh issue edit "$NUMBER" --add-label "$label"
          done
