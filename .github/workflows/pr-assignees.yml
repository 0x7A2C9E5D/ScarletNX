name: PR assignees

# A pull request fails this check while someone assigned to it, its author aside, has not approved it: assigning
# someone whose pending work it touches holds its merge for their approval, and taking them off the assignees lets it
# go. As a required check of main it keeps the merge button off. It runs again on each push, assignment and review.
# pull_request_target takes this workflow from main, so a pull request can't change the check it is held by; nothing
# of the pull request is checked out or run
on:
  pull_request_target:
    types: [opened, reopened, synchronize, assigned, unassigned]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

# one at a time per pull request, as the title check: the newest of a burst waits and those before it are dropped
concurrency:
  group: pr-assignees-${{ github.event.pull_request.number }}

jobs:
  assignees:
    name: Assignees approved
    runs-on: ubuntu-26.04
    steps:
      # the script of the branch it merges into, as it is now
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: scripts/pr-assignees.py
          sparse-checkout-cone-mode: false
      # read now, not from the event: an assignment or a review that came after it counts
      - name: Read the assignees and the reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '{author: .user.login, assignees: [.assignees[].login]}' >pr.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[] | {user: .user.login, state}' |
            jq -s . >reviews.json
          jq -s '.[0] + {reviews: .[1]}' pr.json reviews.json >state.json
      - name: Check every assignee approved
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ ! -f scripts/pr-assignees.py ]; then
            echo "scripts/pr-assignees.py is not on $BASE: the check runs $BASE's copy, so it waits for it to merge" >&2
            exit 1
          fi
          python3 scripts/pr-assignees.py state.json
