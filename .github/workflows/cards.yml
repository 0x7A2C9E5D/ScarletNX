name: Discord cards

# A Discord card for each pull request, each issue and each push to main (scripts/discord-cards.py), posted when it comes
# and edited at each change: a push, an edit, a label, a review, a comment (the latest shown), and each package of its
# build as its job ends. scripts/publish-builds.py draws a card again once its files are published. Nothing of a pull
# request runs here: the checkout is main's, and its build is only read. A review of a fork's pull request runs without
# the secrets, so its card waits for the next event. The secrets: NIGHTLY_TOKEN may write scarletnx/nightly's contents,
# where each card's message id is kept (branch discord-cards); DISCORD_WEBHOOK_NIGHTLY, DISCORD_WEBHOOK_PRS and
# DISCORD_WEBHOOK_ISSUES are the channels' webhooks (without one, nothing is posted there and the run says so)
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed, ready_for_review, converted_to_draft, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  # a build starting: followed until it ends
  workflow_run:
    workflows: [Build]
    types: [requested]

permissions:
  contents: read
  actions: read # a build's jobs
  pull-requests: read
  issues: read

env:
  NIGHTLY_REPO: scarletnx/nightly
  PYTHONUNBUFFERED: '1' # a build followed for minutes says each step as it happens
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NIGHTLY_TOKEN: ${{ secrets.NIGHTLY_TOKEN }}
  DISCORD_WEBHOOK_NIGHTLY: ${{ secrets.DISCORD_WEBHOOK_NIGHTLY }}
  DISCORD_WEBHOOK_PRS: ${{ secrets.DISCORD_WEBHOOK_PRS }}
  DISCORD_WEBHOOK_ISSUES: ${{ secrets.DISCORD_WEBHOOK_ISSUES }}

jobs:
  card:
    name: Draw the card
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # One at a time for each card, so two events never post it twice; a newer event's run replaces one that waits,
    # each drawing the card whole
    concurrency:
      group: >-
        card-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) ||
        github.event.issue.number && format('{0}-{1}', github.event.issue.pull_request && 'pr' || 'issue',
        github.event.issue.number) || format('nightly-{0}', github.sha) }}
    steps:
      # main's scripts, and for a push its history, which a nightly's changes come from
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          sparse-checkout: scripts
      - run: python3 scripts/discord-cards.py event --repo "$GITHUB_REPOSITORY" --to "$NIGHTLY_REPO" --checkout .

  watch:
    name: Follow the build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          sparse-checkout: scripts
      - run: python3 scripts/discord-cards.py event --repo "$GITHUB_REPOSITORY" --to "$NIGHTLY_REPO" --checkout .
