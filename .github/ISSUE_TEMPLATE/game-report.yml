# A game that doesn't run as it should. The log attached is summarized in a comment by .github/workflows/game-reports.yml
name: Game report
description: A game doesn't start, crashes, or doesn't look, sound or play right
title: '[game] '
labels: ['game report']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing a game. Attach its log and a comment will summarize it within a few minutes: how the run ended, where in the game's code, and other reports that failed the same way.

        Please attach nothing of the game itself: no keys, dumps, game files or save data.
  - type: input
    id: game
    attributes:
      label: Game
      description: Its name, and its version or update if you know them.
      placeholder: Some Game 1.2.0
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: What happens
      options:
        - It doesn't start (black screen, or it closes)
        - It crashes or stops with an error while playing
        - It freezes
        - Something looks wrong
        - Something sounds wrong
        - Controls don't work right
        - It runs slowly
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What you did and what you saw
      description: Where in the game it happens, what you pressed before, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Drag the log file here. In the launcher, Share log saves one with the last run's output (and copies its path, or opens the share sheet on a phone). The game's own log is `<game>.log` in `~/.local/state/scarletnx/games/<game>/` on Linux, `%APPDATA%\scarletnx\state\games\<game>\` on Windows and `~/Library/Application Support/scarletnx/state/games/<game>/` on macOS. A log over 25 MB can be zipped or gzipped first.
      placeholder: Drop the .log, .zip or .gz file here
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: ScarletNX build
      description: The nightly's date, or the commit shown in the launcher's title bar. The log names it too, from builds that write a build line.
      placeholder: Nightly 2026-10-19 (abc1234)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system, CPU and GPU.
      placeholder: Windows 11, Ryzen 5 5600, RTX 3060
    validations:
      required: true
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots or video
      description: Optional. Drag them here.
