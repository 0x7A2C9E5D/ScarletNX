; ScarletNX GUI theme: a folder of themes/ holding this file, the folder's name its id. A folder named like a
; built-in replaces it. Keys left out, or that cannot be read, keep the [theme] base's value. A comment takes a
; line of its own. docs/GUI.md describes every key.
[theme]
name = YoRHa
; default | yorha | yorha-loading
base = yorha

[colors]
; #RRGGBB. soft: hints and secondary text; focus: the focused line, or its band; dim: rules and empty segments
page = #DAD6BE
ink = #45413A
soft = #8A8676
focus = #45413A
active = #8A6A2A
failure = #A5473C
dim = #B4B09C

[head]
; plain | bar | none; rule: a line under the head
style = bar
rule = true
; the title of each screen, empty for none
menu = SCARLETNX  /  MENU
games = SCARLETNX  /  GAMES
keys = SCARLETNX  /  KEYS
compiling = SYSTEM  /  COMPILING
loading = SYSTEM  /  LOADING

[body]
; before each menu item; quotes keep spaces
marker = "■ "
; the focused line: color | bar
focus = bar

[footer]
; plain | bar | none; rule: a line over the footer
style = bar
rule = false

[run]
; console: the driver's output as it comes; steps: a loading screen
layout = console
; faint lines over the page; the progress bar and its percentage
texture = false
bar = false
; none | left | right
ring = none

[transitions]
; milliseconds, 0 to 10000; 0 turns the thing off
fade_in_ms = 250
fade_out_ms = 500
; how a step's line comes in: none | typing | slide | fade
line_in = none
line_in_ms = 220
typing_ms = 25
blink_ms = 500
